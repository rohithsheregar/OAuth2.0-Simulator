<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorize — OAuth2 Authorization Server</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0A1020 0%, #101A30 60%, #0A1020 100%);
    }
    .card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      width: 420px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .card-header {
      padding: 28px 32px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .app-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg,#1D4ED8,#6366F1);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px;
    }
    h1 { color: #F4F7FC; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 5px; }
    .user-line { color: rgba(255,255,255,0.4); font-size: 13px; }
    .user-line strong { color: #38D6F5; }
    .scope-list { padding: 0 32px; }
    .scope-row {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .scope-row:last-child { border-bottom: none; }
    .scope-icon {
      width: 36px; height: 36px;
      border-radius: 9px;
      background: rgba(56,214,245,0.1);
      border: 1px solid rgba(56,214,245,0.2);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .scope-text strong { display: block; font-size: 14px; font-weight: 600; color: #F4F7FC; }
    .scope-text span { font-size: 12px; color: rgba(255,255,255,0.4); }
    .scope-check { margin-left: auto; color: #4ADE80; flex-shrink: 0; }
    .card-footer { padding: 20px 32px; display: flex; gap: 12px; border-top: 1px solid rgba(255,255,255,0.07); }
    .btn-deny {
      flex: 1; height: 44px;
      border: 1px solid rgba(255,107,107,0.4);
      border-radius: 8px;
      background: rgba(255,107,107,0.08);
      color: #FF6B6B;
      font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      transition: background 0.2s;
    }
    .btn-deny:hover { background: rgba(255,107,107,0.18); }
    .btn-allow {
      flex: 2; height: 44px;
      border: none; border-radius: 8px;
      background: #4ADE80;
      color: #06090F;
      font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background 0.2s;
    }
    .btn-allow:hover { background: #22C55E; }
    .server-badge {
      text-align: center;
      color: rgba(255,255,255,0.15);
      font-size: 11px;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="app-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="2" y="7" width="15" height="11" rx="2" fill="none" stroke="white" stroke-width="1.6"/>
          <circle cx="9" cy="12" r="3" fill="none" stroke="white" stroke-width="1.6"/>
          <path d="M9 7l2-3h4L17 7" stroke="white" stroke-width="1.6" fill="none"/>
        </svg>
      </div>
      <h1>{{ client_name }}</h1>
      <p class="user-line">wants to access your account as <strong>{{ username }}</strong></p>
    </div>

    <div class="scope-list">
      {% if 'read:profile' in scope %}
      <div class="scope-row">
        <div class="scope-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="6" r="3" stroke="#38D6F5" stroke-width="1.4"/>
            <path d="M2 14c0-3.3 2.7-5 6-5s6 1.7 6 5" stroke="#38D6F5" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="scope-text">
          <strong>Read Profile</strong>
          <span>Access your name and username</span>
        </div>
        <div class="scope-check">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="7" fill="rgba(74,222,128,0.15)"/>
            <path d="M5 8l2 2 4-4" stroke="#4ADE80" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      {% endif %}
      {% if 'read:email' in scope %}
      <div class="scope-row">
        <div class="scope-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="1" y="3" width="14" height="10" rx="1.5" stroke="#38D6F5" stroke-width="1.4"/>
            <path d="M1 5l7 5 7-5" stroke="#38D6F5" stroke-width="1.4"/>
          </svg>
        </div>
        <div class="scope-text">
          <strong>Read Email</strong>
          <span>Access your email address</span>
        </div>
        <div class="scope-check">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="7" fill="rgba(74,222,128,0.15)"/>
            <path d="M5 8l2 2 4-4" stroke="#4ADE80" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      {% endif %}
    </div>

    <form method="POST" action="/consent">
      <div class="card-footer">
        <button class="btn-deny"  type="submit" name="decision" value="deny">Deny</button>
        <button class="btn-allow" type="submit" name="decision" value="approve">Allow access</button>
      </div>
    </form>

    <div class="server-badge">OAuth2 Authorization Server — BCS703 Lab</div>
  </div>
</body>
</html>
