<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — OAuth2 Authorization Server</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0A1020 0%, #101A30 60%, #0A1020 100%);
    }
    .card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 40px 36px;
      width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .lock-icon {
      width: 48px; height: 48px;
      background: rgba(56,214,245,0.15);
      border: 1px solid rgba(56,214,245,0.3);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
    }
    h1 { color: #F4F7FC; font-size: 20px; font-weight: 700; margin-bottom: 5px; letter-spacing: -0.02em; }
    .subtitle { color: rgba(255,255,255,0.45); font-size: 13px; margin-bottom: 24px; line-height: 1.5; }
    .app-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(56,214,245,0.1);
      border: 1px solid rgba(56,214,245,0.25);
      border-radius: 6px; padding: 4px 10px;
      color: #38D6F5; font-size: 12px; font-weight: 600;
      margin-bottom: 20px;
    }
    .scope-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 24px;
    }
    .scope-box p { color: rgba(255,255,255,0.4); font-size: 11px; margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.7px; }
    .scope-tag {
      display: inline-block;
      background: rgba(56,214,245,0.15);
      border-radius: 4px;
      padding: 2px 7px;
      color: #38D6F5;
      font-size: 11px; font-weight: 600;
      margin: 2px;
    }
    label { color: rgba(255,255,255,0.6); font-size: 12px; font-weight: 600; display: block; margin-bottom: 7px; letter-spacing: 0.04em; text-transform: uppercase; }
    input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 11px 14px;
      color: #F4F7FC;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 16px;
    }
    input:focus { outline: none; border-color: #38D6F5; box-shadow: 0 0 0 3px rgba(56,214,245,0.15); }
    input::placeholder { color: rgba(255,255,255,0.25); }
    .error-msg {
      background: rgba(255,107,107,0.12);
      border: 1px solid rgba(255,107,107,0.3);
      border-radius: 7px;
      padding: 10px 13px;
      color: #FF6B6B;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .btn {
      width: 100%;
      background: #38D6F5;
      border: none;
      border-radius: 8px;
      padding: 12px;
      color: #06090F;
      font-size: 14px; font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }
    .btn:hover { background: #5DE0F5; }
    .hint {
      margin-top: 18px;
      padding: 11px;
      background: rgba(255,255,255,0.03);
      border-radius: 7px;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      line-height: 1.6;
    }
    .hint strong { color: rgba(255,255,255,0.5); }
    .divider { border-top: 1px solid rgba(255,255,255,0.07); margin: 20px 0; }
    .server-badge { text-align: center; color: rgba(255,255,255,0.2); font-size: 11px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="lock-icon">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <rect x="3" y="10" width="16" height="11" rx="2" fill="none" stroke="#38D6F5" stroke-width="1.6"/>
        <path d="M7 10V7a4 4 0 1 1 8 0v3" stroke="#38D6F5" stroke-width="1.6" fill="none"/>
      </svg>
    </div>
    <h1>Sign in to continue</h1>
    <p class="subtitle">Authorize access to your account</p>

    <div class="app-badge">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="10" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <rect x="3" y="4" width="2" height="5" rx=".5" fill="currentColor" opacity=".7"/>
        <rect x="7" y="4" width="2" height="5" rx=".5" fill="currentColor" opacity=".5"/>
      </svg>
      {{ client_name }}
    </div>

    <div class="scope-box">
      <p>Permissions requested</p>
      {% for s in scope.split() %}
        <span class="scope-tag">{{ s }}</span>
      {% endfor %}
    </div>

    {% if error %}
      <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" placeholder="e.g. alice" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>

      <button class="btn" type="submit">Sign In</button>
    </form>

    <div class="hint">
      <strong>Demo accounts:</strong><br>
      alice / pass123 &nbsp;·&nbsp; bob / letmein &nbsp;·&nbsp; rohith / rohith99
    </div>

    <div class="divider"></div>
    <div class="server-badge">OAuth2 Authorization Server — BCS703 Lab</div>
  </div>
</body>
</html>
